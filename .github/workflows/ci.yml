# Runs every test suite on each push and pull request, so the test counts in
# README.md are checked by GitHub rather than only claimed.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iodss
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: iodss
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iodss"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for the CI database only; real secrets never live in the repo.
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "False"
      DB_NAME: iodss
      DB_USER: iodss
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q

  legacy:
    name: Legacy prototype baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r legacy/requirements-test.txt
      - run: python -m pytest -q legacy/tests

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
